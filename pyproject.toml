[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-delegate-agent"
version = "0.1.0"
description = "A self-bootstrapping real-browser delegate agent for Codex, Claude Code, and OpenAI-compatible models."
requires-python = ">=3.11"
dependencies = [
    "cdp-use==1.4.5",
    "fetch-use==0.4.0",
    "openai>=1.0",
    "websockets==16.0",
]

[project.scripts]
browser-harness = "run:main"

[tool.setuptools]
py-modules = ["run", "helpers", "daemon", "admin", "agent_provider", "agent_policy", "agent_tools", "agent_transcript", "bootstrap", "delegate", "runtime_paths"]
